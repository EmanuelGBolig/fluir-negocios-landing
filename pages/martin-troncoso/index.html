<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martín Troncoso — ahora en martintroncoso.com</title>

    <!-- GitHub Pages no hace redirecciones del lado del servidor, asi que
         esto es lo mas cerca que se puede estar de un 301:
         canonical le dice a Google cual es la buena, el refresh manda al
         visitante y el script lo hace instantaneo si tiene JS. -->
    <link rel="canonical" href="https://martintroncoso.com/">
    <meta http-equiv="refresh" content="0; url=https://martintroncoso.com/">
    <meta name="robots" content="noindex, follow">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #060f20;
            color: #f2eee6;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 2rem;
        }

        a {
            color: #c9a24b;
        }
    </style>
</head>

<body>
    <main>
        <p>La página de Martín Troncoso se mudó.</p>
        <p><a href="https://martintroncoso.com/">Ir a martintroncoso.com</a></p>
    </main>
    <script>location.replace('https://martintroncoso.com/');</script>
</body>

</html>
